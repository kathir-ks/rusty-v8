# Canonical V8 validation-layer taxonomy.
#
# 7 layers spanning V8's execution pipeline from JS source text through
# interpreter execution. This file is the source of truth consumed by the
# cpp2rust validation harness (cpp2rust/validation/taxonomy.py).
#
# Constraints enforced by the loader:
#   - between 5 and 10 layers
#   - unique kebab-case ids
#   - unique, contiguous order indices starting at 1
#   - the pipeline must include scanner, parser, ast, and bytecode stages

v8_revision: "13.6"   # V8 version vendored in codebase/ (include/v8-version.h); fixtures pinned to this

layers:
  - id: source-intake
    order: 1
    description: >-
      JS source text intake and character-stream handling — the boundary where
      raw bytes/UTF-16 become a scannable stream.

  - id: scanner
    order: 2
    description: >-
      Lexical analysis: source characters to a token stream (src/parsing/scanner*).

  - id: parser
    order: 3
    description: >-
      Syntactic analysis: token stream to a parse tree / AST builder driver
      (src/parsing/parser*, preparser).

  - id: ast
    order: 4
    description: >-
      AST node model and the structures the parser emits (src/ast/*).

  - id: bytecode-gen
    order: 5
    description: >-
      Bytecode generation (Ignition): AST to bytecode
      (src/interpreter/bytecode-generator and friends).

  - id: interpreter
    order: 6
    description: >-
      Bytecode interpreter execution: running generated bytecode to a result
      (src/interpreter/*).

  - id: runtime-support
    order: 7
    description: >-
      Supporting runtime/util modules the upper layers depend on
      (numbers, strings, utils) validated as a backstop bucket.
