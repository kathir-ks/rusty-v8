# C++ macro → Rust pattern mappings
patterns:
  # V8/Chromium assert macros
  - cpp: "DCHECK($cond)"
    rust: "debug_assert!($cond)"
    kind: macro

  - cpp: "DCHECK_EQ($a, $b)"
    rust: "debug_assert_eq!($a, $b)"
    kind: macro

  - cpp: "DCHECK_NE($a, $b)"
    rust: "debug_assert_ne!($a, $b)"
    kind: macro

  - cpp: "DCHECK_LT($a, $b)"
    rust: "debug_assert!($a < $b)"
    kind: macro

  - cpp: "DCHECK_LE($a, $b)"
    rust: "debug_assert!($a <= $b)"
    kind: macro

  - cpp: "DCHECK_GT($a, $b)"
    rust: "debug_assert!($a > $b)"
    kind: macro

  - cpp: "DCHECK_GE($a, $b)"
    rust: "debug_assert!($a >= $b)"
    kind: macro

  - cpp: "DCHECK_IMPLIES($a, $b)"
    rust: "debug_assert!(!($a) || ($b))"
    kind: macro

  - cpp: "CHECK($cond)"
    rust: "assert!($cond)"
    kind: macro

  - cpp: "CHECK_EQ($a, $b)"
    rust: "assert_eq!($a, $b)"
    kind: macro

  - cpp: "CHECK_NE($a, $b)"
    rust: "assert_ne!($a, $b)"
    kind: macro

  - cpp: "CHECK_LT($a, $b)"
    rust: "assert!($a < $b)"
    kind: macro

  - cpp: "CHECK_LE($a, $b)"
    rust: "assert!($a <= $b)"
    kind: macro

  - cpp: "CHECK_GT($a, $b)"
    rust: "assert!($a > $b)"
    kind: macro

  - cpp: "CHECK_GE($a, $b)"
    rust: "assert!($a >= $b)"
    kind: macro

  - cpp: "UNREACHABLE()"
    rust: "unreachable!()"
    kind: macro

  - cpp: "FATAL($msg)"
    rust: "panic!($msg)"
    kind: macro

  - cpp: "UNIMPLEMENTED()"
    rust: "unimplemented!()"
    kind: macro

  # Common C++ utility macros
  - cpp: "ARRAY_SIZE($arr)"
    rust: "$arr.len()"
    kind: macro

  - cpp: "offsetof($T, $field)"
    rust: "std::mem::offset_of!($T, $field)"
    kind: macro

  - cpp: "likely($cond)"
    rust: "$cond"
    kind: macro

  - cpp: "unlikely($cond)"
    rust: "$cond"
    kind: macro
